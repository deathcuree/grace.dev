<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Grace Andaya — Full Stack Engineer" />
    <link rel="icon" href="/favicon.ico" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ga-theme");
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-theme", stored || (systemDark ? "dark" : "light"));
        } catch (e) {}
      })();
    </script>
    <title>Grace Andaya</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
